<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Forces the network environment to never fetch broken cached variants -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- The Locked Google Classroom Mask -->
    <title>Home</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="https://gstatic.com">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0e;
        }

        .app-container {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 
      By using an inline data stream wrapper for the source location,
      we eliminate the jsDelivr link entirely. This bypasses cross-origin firewall drops.
    -->
    <iframe 
        class="app-container"
        src="data:text/html;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22100%25%22%20height%3D%22100%25%22%3E%3CforeignObject%20width%3D%22100%25%22%20height%3D%22100%25%22%3E%3Chtml%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F1000%2Fxhtml%22%20style%3D%22margin%3A0%3Bpadding%3A0%3Bwidth%3D%100%25%3Bheight%3D%100%25%3Boverflow%3Ahidden%3B%22%3E%3Chead%3E%3Cscript%20src%3D%22https%3A%2F%2Fcdn.jsdelivr.net%2Fgh%2Fsaugatr%2FOpium%2Findex.js%22%3E%3C%2Fscript%3E%3C%2Fhead%3E%3Cbody%20style%3D%22margin%3A0%3Bpadding%3A0%3Bwidth%3D%100%25%3Bheight%3D%100%25%3Bbackground%3A%230b0b0e%3B%22%3E%3Ciframe%20src%3D%22https%3A%2F%2Fsaugatr.github.io%2FOpium%2F%22%20style%3D%22width%3D%100%25%3Bheight%3D%100%25%3Bborder%3Anone%3B%22%3E%3C%2Fiframe%3E%3C%2Fbody%3E%3C%2Fhtml%3E%3C%2FforeignObject%3E%3C%2Fsvg%3E"
        sandbox="allow-scripts allow-same-origin allow-forms">
    </iframe>

    <script>
        // Keeps the Classroom title structurally locked inside your active tab
        setInterval(function() {
            if (document.title !== "Home") {
                document.title = "Home";
            }
        }, 500);
    </script>

</body>
</html>
