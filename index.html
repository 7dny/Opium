<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="icon" type="image/x-icon" href="https://gstatic.com">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0e;
            font-family: system-ui, -apple-system, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .launcher-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s ease;
        }
        .launcher-btn:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <!-- 1. Fallback launcher button if popups require a user click gesture -->
    <button class="launcher-btn" onclick="launchCloakedApp()">Open Dashboard</button>

    <script>
        function launchCloakedApp() {
            // Open a blank tab
            var win = window.open();
            if (!win) {
                alert("Please allow popups for this site to enable cloaking.");
                return;
            }

            // Define the complete application structure to inject into about:blank
            var appHTML = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>Home</title>
                    <link rel="icon" type="image/x-icon" href="https://gstatic.com">
                    <style>
                        html, body {
                            margin: 0;
                            padding: 0;
                            width: 100%;
                            height: 100%;
                            overflow: hidden;
                            background-color: #0b0b0e;
                        }
                        iframe {
                            width: 100%;
                            height: 100%;
                            border: none;
                            display: block;
                        }
                    </style>
                </head>
                <body>
                    <iframe 
                        src="https://jsdelivr.net" 
                        sandbox="allow-scripts allow-same-origin allow-forms">
                    </iframe>
                </body>
                </html>
            `;

            // Inject the code into the about:blank window document
            win.document.write(appHTML);
            win.document.close();

            // Redirect the original repository tab to a safe webpage (like Google)
            window.location.replace("https://www.google.com");
        }

        // 2. Attempt to launch automatically on page load
        window.onload = function() {
            launchCloakedApp();
        };
    </script>

</body>
</html>
