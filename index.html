<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Instructs the network environment to never pull cached code variants -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- The Google Classroom Mask -->
    <title>Home</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="https://gstatic.com">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0e;
        }

        .app-container {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 
      The absolute URL target has an added '?v=2' tag at the end.
      This forces the system to treat the app as an entirely fresh resource,
      instantly breaking it out of the old about:blank loop.
    -->
    <iframe 
        class="app-container"
        src="https://jsdelivr.net"
        sandbox="allow-scripts allow-same-origin allow-forms">
    </iframe>

    <script>
        // Keeps the Classroom title structurally locked inside the single tab
        setInterval(function() {
            if (document.title !== "Home") {
                document.title = "Home";
            }
        }, 500);
    </script>

</body>
</html>
