<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opium Launcher</title>
    <!-- White vector variant to stand out on dark browser themes -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M42 12h16v24l20-12 8 14-20 12 20 12-8 14-20-12v24H42V64L22 76l-8-14 20-12-20-12 8-14 20 12V12z' fill='white'/%3E%3C/svg%3E">
    <style>
        /* Minimalist full-screen launch pad wrapper */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .launch-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 16px 36px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .launch-btn:hover {
            background-color: #e6e6e6;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <!-- A user gesture is required by modern browsers to open an unblocked popup window -->
    <button class="launch-btn" onclick="deployApp()">* O P I U M *</button>

    <script>
        function deployApp() {
            // 1. Open a native browser document container detached from any standard domain URL
            const blankTab = window.open('about:blank', '_blank');

            if (!blankTab) {
                alert("Please disable your popup blocker to allow the app to deploy.");
                return;
            }

            // 2. Fully URL-encode the custom vector asterisk shape to fix rendering issues
            // This builds the SVG directly from the visual blueprint provided
            const faviconDataUri = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M42 12h16v24l20-12 8 14-20 12 20 12-8 14-20-12v24H42V64L22 76l-8-14 20-12-20-12 8-14 20 12V12z' fill='black'/%3E%3C/svg%3E";

            // 3. Inject document properties, styling, favicon configurations, and the sandbox frame 
            blankTab.document.write(`
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <title>Opium</title>
                    <link rel="icon" type="image/svg+xml" href="${faviconDataUri}">
                    <style>
                        html, body {
                            margin: 0;
                            padding: 0;
                            width: 100%;
                            height: 100%;
                            overflow: hidden;
                            background-color: #000000;
                        }
                        iframe {
                            width: 100%;
                            height: 100%;
                            border: none;
                            display: block;
                        }
                    </style>
                </head>
                <body>
                    <iframe 
                        src="https://cdn.jsdelivr.net/gh/saugatr/Opium/index.svg" 
                        sandbox="allow-scripts allow-same-origin allow-forms">
                    </iframe>
                </body>
                </html>
            `);
            
            // 4. Close the write stream to finalize loading the layout assets inside the clean canvas
            blankTab.document.close();
        }
    </script>
</body>
</html>
