<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Total Cache Kill: Forces your browser to completely erase old broken layouts -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- The Locked Google Classroom Mask -->
    <title>Home</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="https://gstatic.com">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0e;
        }

        .app-container {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 
      By bypassing the jsdelivr CDN and targeting the source's native 
      production deployment server directly, your firewall allows the script injection.
    -->
    <iframe 
        class="app-container"
        src="https://github.io"
        sandbox="allow-scripts allow-same-origin allow-forms">
    </iframe>

    <script>
        // Restores the Google Classroom layout mask instantly if altered
        setInterval(function() {
            if (document.title !== "Home") {
                document.title = "Home";
            }
        }, 500);
    </script>

</body>
</html>
