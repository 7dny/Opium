<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- The Google Classroom Mask -->
    <title>Home</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="https://gstatic.com">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0e;
        }

        /* Full screen embed container */
        .app-container {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 
      Embedded directly on GitHub pages to bypass domain blocks.
      Omitting 'allow-popups' enforces the anti-tab rule you requested.
    -->
    <iframe 
        class="app-container"
        src="https://jsdelivr.net"
        sandbox="allow-scripts allow-same-origin allow-forms">
    </iframe>

    <script>
        // Keeps the title and icon locked to prevent any leakages
        setInterval(function() {
            if (document.title !== "Home") {
                document.title = "Home";
            }
        }, 500);
    </script>

</body>
</html>
