<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opium Launcher</title>
    <style>
        /* Minimalist full-screen launch pad wrapper */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .launch-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 16px 36px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .launch-btn:hover {
            background-color: #e6e6e6;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <button class="launch-btn" onclick="deployApp()">* O P I U M *</button>

    <script>
        // 1. Core Base64 Vector Configuration of the identical Black Asterisk
        // Converting to Base64 eliminates any string parsing/whitespace bugs entirely across browsers
        const base64Favicon = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cGF0aCBkPSJNNDIgMTloMTZ2MjRsMjAtMTIgOCAxNC0yMCAxMiAyMCAxMi04IDE0LTIwLTEydjI0SDQyVjY0TDIyIDc2bC04LTE0IDIwLTEyLTIwLTEyIDgtMTQgMjAgMTJVMTJaIiBmaWxsPSJibGFjayIvPjwvc3ZnPg==";

        // 2. Set identical icon on the launcher window instantly
        function applyLauncherFavicon() {
            let link = document.querySelector("link[rel~='icon']");
            if (!link) {
                link = document.createElement('link');
                link.rel = 'icon';
                link.type = 'image/svg+xml';
                document.head.appendChild(link);
            }
            link.href = base64Favicon;
        }
        applyLauncherFavicon();

        // 3. Application Deployment Engine
        function deployApp() {
            const blankTab = window.open('about:blank', '_blank');

            if (!blankTab) {
                alert("Please disable your popup blocker to allow the app to deploy.");
                return;
            }

            // Using programmatic injection instead of document.write to guarantee layout rendering
            const targetDoc = blankTab.document;

            // Clear framework structures cleanly
            targetDoc.open();
            targetDoc.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Opium</title></head><body></body></html>');
            targetDoc.close();

            // Enforce explicit document styling rules directly to the body node
            targetDoc.body.style.margin = "0";
            targetDoc.body.style.padding = "0";
            targetDoc.body.style.backgroundColor = "#000000";
            targetDoc.body.style.overflow = "hidden";
            targetDoc.body.style.width = "100%";
            targetDoc.body.style.height = "100%";

            // 4. Inject the identical Base64 Favicon link node straight to the child target context
            const childFavicon = targetDoc.createElement('link');
            childFavicon.rel = 'icon';
            childFavicon.type = 'image/svg+xml';
            childFavicon.href = base64Favicon;
            targetDoc.head.appendChild(childFavicon);

            // 5. Construct the Fullscreen Sandbox Application Frame container
            const appFrame = targetDoc.createElement('iframe');
            appFrame.src = "https://cdn.jsdelivr.net/gh/saugatr/Opium/index.svg";
            
            // Set the strict security sandboxing rules to block external navigation popups
            appFrame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');

            // Apply direct presentation layouts
            appFrame.style.width = '100%';
            appFrame.style.height = '100%';
            appFrame.style.border = 'none';
            appFrame.style.display = 'block';

            // Pin the application frame straight inside the new document body architecture
            targetDoc.body.appendChild(appFrame);

            // Double down on child node context forced update focus trigger
            // Forces Chromium engines to re-evaluate the empty address space to show the favicon
            if (blankTab.history && blankTab.history.pushState) {
                blankTab.history.pushState(null, null, ' ');
            }
        }
    </script>
</body>
</html>
