<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Opium</title>
</head>
<body>
    <script>
        // 1. Create a full-screen iframe pointing to your target application
        const appFrame = document.createElement('iframe');
        appFrame.src = "https://cdn.jsdelivr.net/gh/saugatr/Opium/index.svg";
        
        // Strict sandbox to restrict new tabs/popups as requested previously
        appFrame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
        
        // Styling to ensure it covers the viewport seamlessly
        appFrame.style.position = 'fixed';
        appFrame.style.top = '0';
        appFrame.style.left = '0';
        appFrame.style.width = '100vw';
        appFrame.style.height = '100vh';
        appFrame.style.border = 'none';
        appFrame.style.margin = '0';
        appFrame.style.padding = '0';
        appFrame.style.overflow = 'hidden';
        appFrame.style.zIndex = '999999';

        // 2. Clear out the current window completely to establish the blank environment
        document.open();
        document.write('');
        document.close();

        // 3. Re-inject the favicon into the newly cleared <head> using an inline SVG Data URI
        const link = document.createElement('link');
        link.rel = 'icon';
        link.type = 'image/svg+xml';
        // This converts the black asterisk shape into a vector string so the browser displays it in the tab
        link.href = `data:image/svg+xml;utf8,<svg xmlns="http://w3.org" viewBox="0 0 100 100"><path d="M42 12h16v24l20-12 8 14-20 12 20 12-8 14-20-12v24H42V64L22 76l-8-14 20-12-20-12 8-14 20 12V12z" fill="black"/></svg>`;
        document.head.appendChild(link);

        // 4. Append the frame to the newly cleared environment
        document.body.style.margin = '0';
        document.body.style.backgroundColor = '#000000';
        document.body.appendChild(appFrame);
    </script>
</body>
</html>
